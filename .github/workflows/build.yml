name: Build Unsigned DailyOS IPA

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA (SideStore / iLoader Compatible)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute Build Metadata & List Sources
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="3.3.0"
          BUILD_NUM="${{ github.run_number }}"
          IPA_NAME="DailyOS-v${VERSION}-b${BUILD_NUM}-${SHORT_SHA}.ipa"
          ARTIFACT_NAME="DailyOS-v${VERSION}-b${BUILD_NUM}-${SHORT_SHA}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_num=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building commit ${SHORT_SHA} -> ${IPA_NAME}"
          find DailyOS -name "*.swift" | sort

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Clean & Generate Xcode Project
        run: |
          rm -rf build Payload DailyOS.xcodeproj *.ipa
          xcodegen generate

      - name: Build Unsigned Release App
        run: |
          xcodebuild clean build \
            -project DailyOS.xcodeproj \
            -scheme DailyOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.meta.outputs.build_num }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload & Verify Compiled Binary
        run: |
          rm -rf Payload *.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DailyOS.app Payload/

          echo "=== Verifying Info.plist Version & Privacy Keys ==="
          plutil -p Payload/DailyOS.app/Info.plist | grep -E "CFBundleShortVersionString|CFBundleVersion|CFBundleIdentifier|NSMotionUsageDescription|NSCameraUsageDescription|NSCalendarsFullAccessUsageDescription"
          plutil -p Payload/DailyOS.app/Info.plist | grep -q "NSMotionUsageDescription"
          plutil -p Payload/DailyOS.app/Info.plist | grep -q "NSCameraUsageDescription"
          plutil -p Payload/DailyOS.app/Info.plist | grep -q "NSCalendarsFullAccessUsageDescription"

          echo "=== Verifying v3.3 Symbols in Mach-O Binary (UTF-8 & UTF-16LE) ==="
          python3 - <<'EOF'
          from pathlib import Path
          import sys

          binary_path = Path("Payload/DailyOS.app/DailyOS")
          data = binary_path.read_bytes()
          data_lower = data.lower()

          def has_string(s: str) -> bool:
              low = s.lower()
              return (low.encode("utf-8") in data_lower) or (low.encode("utf-16-le") in data_lower)

          # Use >15-byte literals so ARM64 Release (-O) never folds them into inline small-string registers
          required = [
              "Connect Google Calendar & Tasks",
              "Preview Solar-Orange Wake Screen",
              "All alarms stopped",
              "Steps Time Limit",
          ]
          forbidden = [
              "AI Camera Pushups",
          ]

          for item in required:
              if not has_string(item):
                  print(f"ERROR: Missing expected v3.3 string in binary: {item}")
                  sys.exit(1)
              print(f"OK (found): {item}")

          for item in forbidden:
              if has_string(item):
                  print(f"ERROR: Stale removed string found in binary: {item}")
                  sys.exit(1)
              print(f"OK (absent): {item}")
          EOF

          IPA_NAME="${{ steps.meta.outputs.ipa_name }}"
          zip -r9 "${IPA_NAME}" Payload
          ls -lh "${IPA_NAME}"

      - name: Upload Versioned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.ipa_name }}
          retention-days: 30

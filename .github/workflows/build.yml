name: Build Unsigned DailyOS IPA

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA (SideStore / iLoader Compatible)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Compute Build Metadata & List Sources
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="4.5.0"
          BUILD_NUM="${{ github.run_number }}"
          IPA_NAME="DailyOS-v${VERSION}-b${BUILD_NUM}-${SHORT_SHA}.ipa"
          ARTIFACT_NAME="DailyOS-v${VERSION}-b${BUILD_NUM}-${SHORT_SHA}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_num=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building commit ${SHORT_SHA} -> ${IPA_NAME}"
          find DailyOS Shared DailyOSWidgets -name "*.swift" | sort

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Clean & Generate Xcode Project
        run: |
          rm -rf build Payload DailyOS.xcodeproj *.ipa
          xcodegen generate

      - name: Build Unsigned Release App & Embedded Widget Extension
        run: |
          xcodebuild clean build \
            -project DailyOS.xcodeproj \
            -scheme DailyOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.meta.outputs.build_num }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload & Verify Compiled Binary + Widget Extension
        run: |
          rm -rf Payload *.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DailyOS.app Payload/

          echo "=== Verifying Main App Info.plist Version, Live Activities, PiP Audio Mode & Privacy Keys ==="
          plutil -p Payload/DailyOS.app/Info.plist | grep -E "CFBundleShortVersionString|CFBundleVersion|CFBundleIdentifier|NSSupportsLiveActivities|UIBackgroundModes|NSMotionUsageDescription|NSCameraUsageDescription|NSCalendarsFullAccessUsageDescription|NSPhotoLibraryAddUsageDescription"
          plutil -p Payload/DailyOS.app/Info.plist | grep -q "NSSupportsLiveActivities"
          plutil -p Payload/DailyOS.app/Info.plist | grep -q "UIBackgroundModes"
          plutil -p Payload/DailyOS.app/Info.plist | grep -q "NSMotionUsageDescription"
          plutil -p Payload/DailyOS.app/Info.plist | grep -q "NSCameraUsageDescription"
          plutil -p Payload/DailyOS.app/Info.plist | grep -q "NSCalendarsFullAccessUsageDescription"
          plutil -p Payload/DailyOS.app/Info.plist | grep -q "NSPhotoLibraryAddUsageDescription"

          echo "=== Verifying Compiled App Icon Asset Catalog (Assets.car / AppIcon) ==="
          if [ ! -f "Payload/DailyOS.app/Assets.car" ] && ! ls Payload/DailyOS.app/AppIcon*.png 1> /dev/null 2>&1; then
            echo "ERROR: Missing compiled AppIcon (Assets.car or AppIcon*.png) in Payload/DailyOS.app"
            exit 1
          fi
          ls -lh Payload/DailyOS.app/Assets.car Payload/DailyOS.app/AppIcon*.png 2>/dev/null || true
          plutil -p Payload/DailyOS.app/Info.plist | grep -E "CFBundleIconName|CFBundleIcons" || true

          echo "=== Verifying Embedded DailyOSWidgets.appex & Matching Versions ==="
          WIDGET_APPEX="Payload/DailyOS.app/PlugIns/DailyOSWidgets.appex"
          if [ ! -d "${WIDGET_APPEX}" ]; then
            echo "ERROR: Missing embedded WidgetKit extension at ${WIDGET_APPEX}"
            exit 1
          fi
          plutil -p "${WIDGET_APPEX}/Info.plist" | grep -E "CFBundleShortVersionString|CFBundleVersion|CFBundleIdentifier|NSExtensionPointIdentifier"

          APP_SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/DailyOS.app/Info.plist)
          APP_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/DailyOS.app/Info.plist)
          EXT_SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${WIDGET_APPEX}/Info.plist")
          EXT_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "${WIDGET_APPEX}/Info.plist")

          if [ "${APP_SHORT}" != "${EXT_SHORT}" ] || [ "${APP_VER}" != "${EXT_VER}" ]; then
            echo "ERROR: Version mismatch between DailyOS (${APP_SHORT} / ${APP_VER}) and DailyOSWidgets (${EXT_SHORT} / ${EXT_VER})"
            exit 1
          fi
          echo "OK: DailyOS and DailyOSWidgets versions match (${APP_SHORT} b${APP_VER})"

          echo "=== Verifying v4.5 Symbols in Mach-O Binary (UTF-8 & UTF-16LE, Case-Insensitive) ==="
          python3 - <<'EOF'
          from pathlib import Path
          import sys

          binary_path = Path("Payload/DailyOS.app/DailyOS")
          data = binary_path.read_bytes()
          data_lower = data.lower()

          def has_string(s: str) -> bool:
              low = s.lower()
              return (low.encode("utf-8") in data_lower) or (low.encode("utf-16-le") in data_lower)

          required = [
              "Connect Google Calendar & Tasks",
              "Auto-Sync Tasks to Google Calendar",
              "Do Challenge",
              "Steps",
              "Preview Solar-Orange Wake Screen",
              "Daily Notifications",
              "Main Character Morning",
              "Weekly Winter Arc Recap",
              "gemini-3.5-flash-lite",
              "TURN ALARM OFF & START DAY",
              "Drink a full glass of water",
              "SLEEP CYCLES & BEDTIME",
              "STAGE 3 • MORNING ACTIVATION",
              "Photo check-in armed",
              "MORNING SPOTLIGHT",
              "NIGHT SPOTLIGHT",
              "TODAY'S OVERVIEW",
              "All scheduled blocks complete",
              "Post picture now!",
              "Photo proof in 30s",
              "Your task has started",
          ]
          forbidden = [
              "AI Camera Pushups",
              "Swipe away for Floating Pill",
          ]

          for item in required:
              if not has_string(item):
                  print(f"ERROR: Missing expected v4.5 string in binary: {item}")
                  sys.exit(1)
              print(f"OK (found): {item}")

          for item in forbidden:
              if has_string(item):
                  print(f"ERROR: Stale removed string found in binary: {item}")
                  sys.exit(1)
              print(f"OK (absent): {item}")
          EOF

          IPA_NAME="${{ steps.meta.outputs.ipa_name }}"
          zip -r9 "${IPA_NAME}" Payload
          ls -lh "${IPA_NAME}"

      - name: Upload Versioned IPA Artifact
        id: upload_ipa_primary
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.ipa_name }}
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Wait Before Artifact Upload Retry
        if: steps.upload_ipa_primary.outcome == 'failure'
        run: sleep 15

      - name: Retry Versioned IPA Artifact Upload
        id: upload_ipa_retry
        if: steps.upload_ipa_primary.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.ipa_name }}
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Publish IPA to Rolling GitHub Release
        id: publish_release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_NAME: ${{ steps.meta.outputs.ipa_name }}
          IPA_PATH: ${{ steps.meta.outputs.ipa_name }}
        run: |
          if [ ! -f "${IPA_PATH}" ]; then
            echo "ERROR: Expected IPA not found at ${IPA_PATH}"
            exit 1
          fi
          TAG="latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${IPA_PATH}" --clobber
            gh release edit "$TAG" \
              --title "DailyOS Latest Build (${IPA_NAME})" \
              --notes "Automated unsigned iOS IPA build from commit ${GITHUB_SHA::7}. Download the .ipa directly for SideStore / iLoader."
          else
            gh release create "$TAG" "${IPA_PATH}" \
              --title "DailyOS Latest Build (${IPA_NAME})" \
              --notes "Automated unsigned iOS IPA build from commit ${GITHUB_SHA::7}. Download the .ipa directly for SideStore / iLoader."
          fi

      - name: Verify IPA Delivery
        run: |
          PRIMARY="${{ steps.upload_ipa_primary.outcome }}"
          RETRY="${{ steps.upload_ipa_retry.outcome }}"
          RELEASE="${{ steps.publish_release.outcome }}"
          echo "Delivery outcomes -> artifact_primary=${PRIMARY}, artifact_retry=${RETRY}, release=${RELEASE}"
          if [ "${PRIMARY}" != "success" ] && [ "${RETRY}" != "success" ] && [ "${RELEASE}" != "success" ]; then
            echo "ERROR: Both Actions Artifact upload and Rolling GitHub Release upload failed."
            exit 1
          fi
          echo "OK: IPA delivered cleanly."

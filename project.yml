name: DailyOS
options:
  bundleIdPrefix: com.patrik
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  DailyOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DailyOS
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrik.dailyos
        PRODUCT_NAME: DailyOS
        MARKETING_VERSION: "3.1.0"
        CURRENT_PROJECT_VERSION: "10"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DailyOS/Info.plist
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    info:
      path: DailyOS/Info.plist
      properties:
        CFBundleDisplayName: DailyOS
        CFBundleName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: "DailyOS requires camera access for on-device AI squat wake missions and live photo proof during scheduled focus check-ins."
        NSCalendarsFullAccessUsageDescription: "DailyOS optionally reads your iOS calendars to schedule focus accountability check-ins for your events."
        NSCalendarsUsageDescription: "DailyOS optionally reads your calendar events to run focus accountability blocks."
        NSMotionUsageDescription: "DailyOS uses CoreMotion pedometer sensors to count your live steps during the Steps wake mission."
